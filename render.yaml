services:
  - type: web
    name: shopstream-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @shopstream/db generate && pnpm --filter @shopstream/api build && pnpm --filter @shopstream/db exec tsx src/migrate.ts
    startCommand: cd ../.. && pnpm --filter @shopstream/api start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: CSRF_SECRET
        generate: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: orders@shopstream.app
      - key: BREVO_FROM_NAME
        value: ShopStream
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://shopstream.vercel.app
      - key: HEALTH_TOKEN
        generate: true
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: BING_API_KEY
        sync: false
      - key: BING_SITE_URL
        value: https://shopstream.vercel.app
